<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<div class="container">

    <h1>Student Registration Form</h1>
    <p>Enter your details to complete registration.</p>

    <form action="submit.php" method="POST" id="registrationForm">

        <h2>Personal Details</h2>

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name"
               maxlength="100" required>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>

        <label for="gender">Gender:</label>
        <select id="gender" name="gender" required>
            <option value="">Select Gender</option>
            <option value="Female">Female</option>
            <option value="Male">Male</option>
            <option value="Other">Other</option>
            <option value="Prefer not to say">Prefer not to say</option>
        </select>

        <h2>Contact Details</h2>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email"
               maxlength="150" required>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone"
               pattern="[0-9]{10}" maxlength="10"
               placeholder="Enter 10-digit number" required>

        <label for="address">Address:</label>
        <textarea id="address" name="address"
                  rows="3" maxlength="500" required></textarea>

        <label for="city">City / District:</label>
        <input type="text" id="city" name="city"
               maxlength="100" required>

        <label for="pincode">PIN Code:</label>
        <input type="text" id="pincode" name="pincode"
               pattern="[0-9]{6}" maxlength="6" required>

        <h2>Educational Details</h2>

        <label for="course">Course:</label>
        <select id="course" name="course" required>
            <option value="">Select Course</option>
            <option value="CSE">Computer Science Engineering</option>
            <option value="ISE">Information Science Engineering</option>
            <option value="ECE">Electronics and Communication</option>
            <option value="EEE">Electrical and Electronics</option>
            <option value="ME">Mechanical Engineering</option>
            <option value="Other">Other</option>
        </select>

        <label for="year">Year of Study:</label>
        <select id="year" name="year" required>
            <option value="">Select Year</option>
            <option value="1st Year">1st Year</option>
            <option value="2nd Year">2nd Year</option>
            <option value="3rd Year">3rd Year</option>
            <option value="4th Year">4th Year</option>
        </select>

        <label for="qualification">Previous Qualification:</label>
        <select id="qualification" name="qualification" required>
            <option value="">Select Qualification</option>
            <option value="SSLC">SSLC</option>
            <option value="PUC">PUC / 12th</option>
            <option value="Diploma">Diploma</option>
            <option value="Other">Other</option>
        </select>

        <label for="hobbies">Hobbies / Interests:</label>
        <textarea id="hobbies" name="hobbies"
                  rows="3" maxlength="500"></textarea>

        <div class="checkbox-row">
            <input type="checkbox" id="declaration"
                   name="declaration" value="yes" required>
            <label for="declaration">
                I confirm that the information provided is correct.
            </label>
        </div>

        <button type="submit">Submit Registration</button>
        <button type="reset" class="reset-button">Clear Form</button>

    </form>

</div>

<script>
    $(document).ready(function () {

        $("#registrationForm").on("submit", function (event) {

            const phone = $("#phone").val();
            const pincode = $("#pincode").val();

            if (!/^[0-9]{10}$/.test(phone)) {
                alert("Enter a valid 10-digit phone number.");
                event.preventDefault();
                return;
            }

            if (!/^[0-9]{6}$/.test(pincode)) {
                alert("Enter a valid 6-digit PIN code.");
                event.preventDefault();
                return;
            }

        });

    });
</script>

</body>
</html>
